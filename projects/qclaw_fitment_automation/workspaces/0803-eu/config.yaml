version: 1
mode: work

workspace:
  root: .
  traversal:
    strategy: explicit
    projects:
      - .
    include:
      - "*"
    exclude:
      - "_*"
      - "*.disabled"
    order: name_asc
    max_projects: 0

project_layout:
  input: .
  output: output
  log: log.csv
  summary: summary.txt

runtime:
  max_rounds: 150
  max_reply_wait_seconds: 9999
  browser: playwright
  conversation:
    mode: new
    archive_code: ""
    archive_path: conversation_archives.json
  input_sources:
    directories:
      - path: .
        pattern: "*.tsv"
        recursive: false
    order: name_asc
  processing:
    mode: batch
    rows_per_task: 100
    row_label_columns:
      - Make
      - Model
      - VariantName
      - Ktype
    checkpoint_dir: checkpoints
    partitions:
      count: 4
      strategy: contiguous
      manifest_path: partition_manifest.json
  continue_on_error: false
  only_files: []
  input_files:
    skip_processed: true

data_contract:
  requirement: ..\..\requirements\eu_autodata.md
  dimension_representative:
    enabled: false
