version: 1

# 默认直接工作。可临时改为 check（浏览器自检）或 dry_run（仅显示遍历结果）。
mode: work

workspace:
  root: ./workspaces
  traversal:
    # directories: 遍历 root 的直接子目录；glob: 使用 include 通配；explicit: 使用 projects 清单。
    strategy: explicit
    projects:
      - 0713-eu
    include:
      - "*"
    exclude:
      - "_*"
      - "*.disabled"
    order: name_asc
    max_projects: 0

project_layout:
  input: input
  output: output
  log: log.csv
  summary: summary.txt

runtime:
  max_rounds: 150
  browser: openclaw
  continue_on_error: false
  only_files: []
  input_files:
    pattern: "*.tsv"
    order: name_asc
    skip_processed: true

data_contract:
  requirement: requirements\eu_autodata.md
  instructions:
    - 不得新增当前 TSV 年份范围外的年代、代际或车型行
    - 输出顺序必须保持输入 split 第一条到最后一条的边界
