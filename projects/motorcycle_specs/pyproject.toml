[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moto-dimension-crawler"
version = "0.1.0"
description = "Recoverable, traceable MotorcycleSpecs dimension collector"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "SQLAlchemy>=2.0",
  "tenacity>=8.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
browser = ["playwright>=1.45"]

[project.scripts]
moto-dimension-crawler = "moto_dimension_crawler.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

