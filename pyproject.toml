[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "fitment-agent"
version = "0.1.0"
description = "Vehicle fitment data enrichment agent for non-technical teams"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.25",
    "websockets>=12.0",
    "rich>=13.0",
]

[project.scripts]
fitment = "fitment_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fitment_agent"]
