version: 1

# 默认直接工作。可临时改为 check（浏览器自检）或 dry_run（仅显示遍历结果）。
mode: work

workspace:
  root: ./projects
  traversal:
    # directories: 遍历 root 的直接子目录；glob: 使用 include 通配；explicit: 使用 projects 清单。
    strategy: explicit
    projects:
      - 0713-test
    include:
      - "*"
    exclude:
      - "_*"
      - "*.disabled"
    order: name_asc
    max_projects: 0

project_layout:
  input: input
  output: output
  log: log.csv
  summary: summary.txt

runtime:
  max_rounds: 150
  browser: openclaw
  continue_on_error: false
  only_files: []
  input_files:
    pattern: "*.tsv"
    order: name_asc
    skip_processed: true

data_contract:
  requirement: requirements\eu_autodata.md
  full_table:
    columns:
      - 主车型
      - 年份区间
      - 结构
      - 对应尺码
      - 品牌
      - 前台车型
      - 排序依据车型
      - 子车系
      - 分类
      - 版本
      - 门数
      - 代际
      - 区间最小年份
      - 区间最大年份
      - max_length_in
      - max_width_in
      - max_height_in
      - max_length_cm
      - max_width_cm
      - max_height_cm
      - 驾驶室类型
      - 货斗长度_ft
      - 长度余量
      - 无尺码原因
      - 参考车型
      - 备注
      - 迭代状态
    auto_empty_columns:
      - 对应尺码
      - 排序依据车型
      - 子车系
      - 区间最小年份
      - 区间最大年份
      - max_length_cm
      - max_width_cm
      - max_height_cm
      - 长度余量
      - 无尺码原因
  subseries_match:
    columns:
      - Year
      - 主车型
      - 结构
      - 版本
      - 候选车型
      - 匹配数量
    auto_empty_columns:
      - 匹配数量
  instructions:
    - 不得新增当前 TSV 年份范围外的年代、代际或车型行
    - 输出顺序必须保持输入 split 第一条到最后一条的边界
